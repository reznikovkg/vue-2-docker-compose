version: '3.9'

services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    volumes:
    - db-data:/backend/data
    env_file:
      - ./.env
    command: node server.js

  vue:
    build: ./vue
    ports:
      - "8080:8080"
    volumes:
      - ./vue/src:/vue/src
      - ./vue/package.json:/vue/package.json
    env_file:
      - ./.env
    command: npm run serve

  nginx:
    image: nginx:latest
    ports:
      - "9999:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - vue
      - backend

volumes:
  db-data: